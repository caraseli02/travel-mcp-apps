<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Clarification</title>
<style>
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}:root{color-scheme:light;--bg:#fff;--surface:#f8f7f5;--surface-2:#fbfaf8;--line:#e8e3dc;--line-strong:#d8d0c7;--text:#171412;--muted:#706a63;--soft:#9b948c;--accent:#8f5132;--accent-soft:#fff3ec;--danger:#a03a2b;--radius:10px;--shadow:0 1px 2px rgba(23,20,18,.04),0 8px 26px rgba(23,20,18,.06)}body{margin:0;min-width:280px;background:Canvas;color:CanvasText;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;overflow-x:hidden}.shell{max-width:680px;margin:0 auto;padding:14px}.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);box-shadow:var(--shadow);overflow:hidden}.empty,.error,.closed{min-height:180px;display:grid;place-items:center;padding:24px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--muted);font-size:14px;text-align:center}.error{color:var(--danger)}.header{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px;border-bottom:1px solid var(--line);background:var(--surface-2)}.kicker{margin:0 0 4px;color:var(--soft);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.title{margin:0;color:var(--text);font-size:17px;font-weight:700;line-height:1.25;letter-spacing:0}.reason{margin:5px 0 0;color:var(--muted);font-size:12px}.controls{display:flex;align-items:flex-start;gap:6px}.icon{appearance:none;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--text);width:32px;height:32px;font-size:18px;line-height:1;display:grid;place-items:center}.icon:disabled{opacity:.38}.count{min-width:50px;height:32px;display:grid;place-items:center;color:var(--muted);font-size:12px}.options{display:grid;gap:8px;padding:12px}.option{appearance:none;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);min-height:44px;padding:9px 11px;text-align:left;display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;font:inherit}.option[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}.number{width:24px;height:24px;border-radius:999px;background:var(--surface);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700}.option[aria-pressed=true] .number{background:var(--accent);color:#fff}.label{font-size:13px;font-weight:600}.arrow{color:var(--soft);font-size:15px}.footer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--line);background:var(--surface-2)}.custom{min-width:0;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--muted)}.custom input{min-width:0;flex:1;border:0;outline:0;font:inherit;font-size:13px;background:transparent;color:var(--text)}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.status{margin:0;color:var(--danger);font-size:12px}.skip,.submit{appearance:none;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;min-height:36px;padding:0 12px;font-size:12px;font-weight:650}.skip.secondary{border-color:var(--line-strong);background:#fff;color:var(--text)}@media(max-width:520px){.header{grid-template-columns:1fr}.controls{justify-content:space-between}.footer{grid-template-columns:1fr}.actions{justify-content:space-between}.skip,.submit{min-width:88px}}
</style>
</head>
<body>
<main class="shell" aria-live="polite">
  <section class="empty" id="empty">Waiting for trip clarification data...</section>
  <section class="panel" id="content" hidden aria-label="Trip clarification">
    <header class="header">
      <div>
        <p class="kicker" id="kicker">Trip planning</p>
        <h1 class="title" id="prompt">Question</h1>
        <p class="reason" id="reason"></p>
      </div>
      <div class="controls" aria-label="Question navigation">
        <button class="icon" id="prev" type="button" aria-label="Previous question">&#8249;</button>
        <span class="count" id="count">1 of 1</span>
        <button class="icon" id="next" type="button" aria-label="Next question">&#8250;</button>
        <button class="icon" id="close" type="button" aria-label="Close questions">&times;</button>
      </div>
    </header>
    <div class="options" id="options"></div>
    <footer class="footer">
      <label class="custom">
        <span aria-hidden="true">+</span>
        <input id="freeText" type="text" placeholder="Something else">
      </label>
      <div class="actions">
        <p class="status" id="status" role="alert" hidden></p>
        <button class="skip secondary" id="skip" type="button">Skip</button>
        <button class="submit" id="submit" type="button">Submit</button>
      </div>
    </footer>
  </section>
  <section class="closed" id="closed" hidden>Questions dismissed.</section>
</main>
<script>
const intentLabels={plan_trip:"Trip planning",book_hotel:"Hotel search",book_flight:"Flight search"};
const elements={empty:document.getElementById("empty"),content:document.getElementById("content"),closed:document.getElementById("closed"),kicker:document.getElementById("kicker"),prompt:document.getElementById("prompt"),reason:document.getElementById("reason"),prev:document.getElementById("prev"),next:document.getElementById("next"),close:document.getElementById("close"),count:document.getElementById("count"),options:document.getElementById("options"),freeText:document.getElementById("freeText"),status:document.getElementById("status"),skip:document.getElementById("skip"),submit:document.getElementById("submit")};
const state={session:null,index:0,answers:{},submitState:"idle"};
function unwrapToolOutput(raw){return raw?.structuredContent??raw?.toolOutput??raw}
function showEmpty(message){elements.empty.textContent=message;elements.empty.className="empty";elements.empty.hidden=false;elements.content.hidden=true;elements.closed.hidden=true}
function showError(message){elements.empty.textContent=message||"Trip clarification is unavailable.";elements.empty.className="error";elements.empty.hidden=false;elements.content.hidden=true;elements.closed.hidden=true}
function showClosed(){elements.empty.hidden=true;elements.content.hidden=true;elements.closed.hidden=false}
function currentQuestion(){return state.session?.questions?.[state.index]}
function setStatus(message){elements.status.textContent=message||"";elements.status.hidden=!message}
function currentWidgetState(){return window.openai?.widgetState||{}}
function restoreWidgetState(output){const saved=currentWidgetState();if(saved.session_id!==output.session_id)return null;return{index:typeof saved.index==="number"?saved.index:output.current_index||0,answers:saved.answers&&typeof saved.answers==="object"?saved.answers:output.answers||{},submitState:saved.submitState||"idle"}}
function persistWidgetState(){if(!state.session||!window.openai?.setWidgetState)return;const nextState={session_id:state.session.session_id,index:state.index,answers:state.answers,submitState:state.submitState};window.openai.setWidgetState(nextState).catch(()=>{})}
function render(raw){const output=unwrapToolOutput(raw);if(!output)return;if(output.error){showError(output.error);return}if(!Array.isArray(output.questions)){showEmpty("No questions needed.");return}const saved=restoreWidgetState(output);state.session=output;const nextIndex=saved?.index??(output.current_index||0);state.index=Math.max(0,Math.min(nextIndex,output.questions.length-1));state.answers=saved?.answers||output.answers||{};state.submitState=saved?.submitState||"idle";paint()}
function paint(){const question=currentQuestion();if(!question){showEmpty("No questions needed.");return}elements.empty.hidden=true;elements.closed.hidden=true;elements.content.hidden=false;elements.kicker.textContent=(intentLabels[state.session.intent]||"Trip planning")+(state.session.destination?" · "+state.session.destination:"");elements.prompt.textContent=question.prompt;elements.reason.textContent=question.reason||"";elements.reason.hidden=!question.reason;elements.count.textContent=(state.index+1)+" of "+(state.session.total_questions||state.session.questions.length);elements.prev.disabled=state.index===0;elements.next.disabled=state.index>=state.session.questions.length-1;elements.skip.hidden=!question.allow_skip;elements.options.replaceChildren();(question.options||[]).forEach((option,index)=>{const button=document.createElement("button");button.type="button";button.className="option";button.setAttribute("aria-pressed",isSelected(question,option.value)?"true":"false");button.innerHTML='<span class="number"></span><span class="label"></span><span class="arrow" aria-hidden="true"></span>';button.querySelector(".number").textContent=String(index+1);button.querySelector(".label").textContent=option.label;button.querySelector(".arrow").textContent=question.answer_type==="multi_choice"?"✓":"→";button.addEventListener("click",()=>selectAnswer(question,option.value));elements.options.appendChild(button)});elements.submit.textContent=state.submitState==="submitting"?"Submitting":state.submitState==="submitted"?"Submitted":"Submit"}
function isSelected(question,value){const answer=state.answers[question.id];return Array.isArray(answer)?answer.includes(value):answer===value}
function selectAnswer(question,value){setStatus("");if(question.answer_type==="multi_choice"){const current=Array.isArray(state.answers[question.id])?state.answers[question.id]:[];state.answers[question.id]=current.includes(value)?current.filter(item=>item!==value):current.concat(value);paint();persistWidgetState();return}state.answers[question.id]=value;if(state.index>=state.session.questions.length-1){paint();persistWidgetState();return}state.index+=1;paint();persistWidgetState()}
function submitFreeText(){const value=elements.freeText.value.trim();if(!value)return;elements.freeText.value="";selectAnswer(currentQuestion(),value)}
function skipQuestion(){const question=currentQuestion();if(!question)return;state.answers[question.id]="skipped";if(state.index<state.session.questions.length-1)state.index+=1;paint();persistWidgetState()}
function postRpc(method,params,timeout=8000){return new Promise((resolve,reject)=>{const id="trip-clarification-"+Date.now()+"-"+Math.random().toString(16).slice(2);const timer=setTimeout(()=>{window.removeEventListener("message",onMessage);reject(new Error(method+" timed out"))},timeout);function onMessage(event){const message=typeof event.data==="string"?safeJson(event.data):event.data;if(!message||message.id!==id)return;window.clearTimeout(timer);window.removeEventListener("message",onMessage);if(message.error)reject(new Error(message.error.message||"Bridge request failed"));else resolve(message.result)}window.addEventListener("message",onMessage);window.parent?.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
function safeJson(value){try{return JSON.parse(value)}catch{return null}}
async function callTool(name,args){if(window.openai?.callTool)return window.openai.callTool(name,args);return postRpc("tools/call",{name,arguments:args})}
function postFollowUpMessage(text){window.parent?.postMessage({jsonrpc:"2.0",method:"ui/message",params:{role:"user",content:[{type:"text",text}]}},"*")}
async function sendFollowUp(text){try{if(window.openai?.sendFollowUpMessage){await window.openai.sendFollowUpMessage({prompt:text});return}}catch{}postFollowUpMessage(text)}
function followUpText(response){const structured=response?.structuredContent;const summary=structured?.summary||response?.content?.[0]?.text||response?.result||"I answered the trip clarification questions.";const action=structured?.recommended_next_action;return action?summary+" Continue with the recommended next action: "+action+".":summary}
async function submitAnswers(){if(!state.session||state.submitState==="submitting"||state.submitState==="submitted")return;state.submitState="submitting";setStatus("");paint();persistWidgetState();try{const response=await callTool("submit_trip_clarification",{session_json:JSON.stringify(state.session),answers_json:JSON.stringify(state.answers)});const followUp=followUpText(response);await sendFollowUp(followUp);state.submitState="submitted";paint();persistWidgetState();await window.openai?.requestClose?.();showClosed()}catch(error){state.submitState="error";setStatus("Could not submit answers. Try again.");paint();persistWidgetState()}}
elements.prev.addEventListener("click",()=>{state.index=Math.max(0,state.index-1);paint();persistWidgetState()});
elements.next.addEventListener("click",()=>{state.index=Math.min(state.session.questions.length-1,state.index+1);paint();persistWidgetState()});
elements.close.addEventListener("click",async()=>{try{await window.openai?.requestClose?.()}finally{showClosed()}});
elements.skip.addEventListener("click",skipQuestion);
elements.submit.addEventListener("click",submitAnswers);
elements.freeText.addEventListener("keydown",(event)=>{if(event.key==="Enter")submitFreeText()});
function currentToolOutput(){return window.openai?.toolOutput}
render(currentToolOutput());let checksRemaining=50;const checkForLateOutput=window.setInterval(()=>{render(currentToolOutput());checksRemaining-=1;if(checksRemaining<=0||currentToolOutput())window.clearInterval(checkForLateOutput)},100);
window.addEventListener("message",(event)=>{let message=event.data;if(typeof message==="string"){try{message=JSON.parse(message)}catch{return}}if(message?.jsonrpc==="2.0"&&message.method==="ui/notifications/tool-result")render(message.params)},{passive:true});
window.addEventListener("openai:set_globals",(event)=>{render(event.detail?.globals?.toolOutput??window.openai?.toolOutput)},{passive:true});
</script>
</body>
</html>
