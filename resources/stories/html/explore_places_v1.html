<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Places</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --surface: #f7f7f7;
      --surface-2: #fbfbfb;
      --line: #e8e3dc;
      --line-strong: #d7d0c6;
      --text: #171412;
      --muted: #6f6a64;
      --soft: #9b948c;
      --accent: #9a4f2f;
      --accent-ink: #73351e;
      --accent-soft: #fff3ec;
      --danger: #a03a2b;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(23,20,18,.04), 0 8px 28px rgba(23,20,18,.06);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      min-width: 280px;
      font-family: var(--font);
      background: Canvas;
      color: CanvasText;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Widget shell */
    .explore-widget {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px;
    }

    /* Header */
    .explore-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    .explore-title-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: var(--soft);
      cursor: pointer;
      user-select: none;
    }

    .explore-title-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .chevron {
      color: var(--soft);
      display: flex;
      align-items: center;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }

    [aria-expanded="false"] .chevron { transform: rotate(-90deg); }

    .explore-title {
      color: var(--text);
      font-size: 15px;
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .btn-browse {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 11px;
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: 8px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background .15s ease, transform .1s ease;
    }

    .btn-browse:hover  { background: var(--accent-ink); border-color: var(--accent-ink); }
    .btn-browse:active { transform: scale(0.97); }
    .btn-browse:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Carousel */
    .carousel-wrapper {
      position: relative;
    }

    .explore-body {
      border: 1px solid var(--line);
      padding: 0 10px;
      border-radius: var(--radius);
      background: var(--bg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 13px 12px;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .carousel-track::-webkit-scrollbar { display: none; }

    .explore-body[hidden] { display: none; }

    /* Place card */
    /*
      Inline carousel card follows OpenAI UI guidelines:
      - image always present (or placeholder)
      - title + subtitle (max 2 lines each, 3 lines total per guidelines)
      - no nested scroll, no multiple tabs
    */
    .place-card {
      flex: 0 0 176px;
      scroll-snap-align: start;
      background: var(--surface-2);
      border-radius: 8px;
      border: 1px solid var(--line);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
      text-decoration: none;
      color: inherit;
    }

    .place-card:hover {
      background: #fffaf6;
      border-color: var(--line-strong);
      transform: translateY(-1px);
    }

    .place-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Image */
    .card-img {
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: var(--surface);
      flex-shrink: 0;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .place-card:hover .card-img img { transform: scale(1.05); }

    /* Placeholder icon when no image supplied */
    .card-img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--soft);
    }

    /* Body */
    .card-body {
      padding: 8px 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }

    .card-title {
      font-size: 12px;
      font-weight: 650;
      line-height: 1.25;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-subtitle {
      font-size: 11px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Scroll arrow buttons */
    .scroll-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      cursor: pointer;
      color: var(--text);
      transition: opacity 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }

    .scroll-btn.visible { opacity: 1; pointer-events: auto; }
    .scroll-btn:hover   { background: var(--accent-soft); color: var(--accent-ink); }

    .scroll-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .scroll-btn-prev { left: 4px; }
    .scroll-btn-next { right: 4px; }

    /* Empty / error states */
    .explore-empty {
      flex: 1 0 100%;
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* Responsive */
    @media (min-width: 480px) {
      .place-card { flex: 0 0 188px; }
    }

    @media (min-width: 640px) {
      .place-card { flex: 0 0 200px; }
    }
  </style>
</head>
<body>
  <div class="explore-widget" id="explore-widget" role="region" aria-label="Explore places">

    <!-- Header -->
    <div class="explore-header">
      <button
        class="explore-title-btn"
        id="explore-toggle"
        aria-expanded="true"
        aria-controls="explore-body"
        title="Toggle explore section"
      >
        <span class="chevron" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <h2 class="explore-title" id="section-title">Explore</h2>
      </button>

      <button class="btn-browse" id="browse-all-btn" aria-label="Browse all places">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.75"/>
          <path d="M11 11L14 14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
        Browse all
      </button>
    </div>

    <!-- Body / Carousel -->
    <div class="explore-body" id="explore-body">
      <div class="carousel-wrapper" id="carousel-wrapper">
        <button class="scroll-btn scroll-btn-prev" id="scroll-prev" aria-label="Scroll left">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="carousel-track" id="carousel-track" role="list" aria-label="Places to explore"></div>

        <button class="scroll-btn scroll-btn-next" id="scroll-next" aria-label="Scroll right">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script>
    // Host API

    function applyGlobals(globals) {
      if (!globals) return;
      const data = globals.toolOutput ?? globals.structuredContent ?? null;
      render(data);
    }

    window.addEventListener('openai:set_globals', (e) => applyGlobals(e.detail?.globals));
    window.addEventListener('message', (e) => {
      if (e.data?.method === 'ui/notifications/tool-result') {
        render(e.data.params?.structuredContent ?? e.data.params?.toolOutput ?? null);
      }
    });

    // Render

    function render(data) {
      const track = document.getElementById('carousel-track');

      if (!data || data.error) {
        track.innerHTML = `<p class="explore-empty">${esc(data?.error ?? 'No places to explore right now.')}</p>`;
        updateArrows();
        return;
      }

      const places = Array.isArray(data.places) ? data.places : [];

      if (data.section_title) {
        const el = document.getElementById('section-title');
        if (el) el.textContent = data.section_title;
      }

      if (data.browse_url) {
        document.getElementById('browse-all-btn').dataset.url = data.browse_url;
      }

      if (places.length === 0) {
        track.innerHTML = `<p class="explore-empty">No places to show right now.</p>`;
        updateArrows();
        return;
      }

      track.innerHTML = '';

      // 3-8 items per inline carousel per UI guidelines.
      places.slice(0, 8).forEach((place) => {
        const card = document.createElement('div');
        card.className  = 'place-card';
        card.setAttribute('role', 'listitem');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', place.title);

        if (place.url) {
          card.style.cursor = 'pointer';
          const open = () => window.openai?.setOpenInAppUrl?.(place.url);
          card.addEventListener('click', open);
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
          });
        }

        const img = place.image_url
          ? `<img src="${escAttr(place.image_url)}" alt="${escAttr(place.title)}" loading="lazy" />`
          : `<div class="card-img-placeholder" aria-hidden="true">
               <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                 <rect x="3" y="3" width="18" height="18" rx="2"/>
                 <path d="M3 16l5-5 4 4 3-3 6 6"/>
                 <circle cx="8.5" cy="8.5" r="1.5"/>
               </svg>
             </div>`;

        const sub = place.subtitle
          ? `<p class="card-subtitle">${esc(place.subtitle)}</p>`
          : '';

        card.innerHTML = `
          <div class="card-img">${img}</div>
          <div class="card-body">
            <p class="card-title">${esc(place.title)}</p>
            ${sub}
          </div>`;

        track.appendChild(card);
      });

      updateArrows();
    }

    // Collapse / expand

    const toggle = document.getElementById('explore-toggle');
    const body   = document.getElementById('explore-body');

    toggle.addEventListener('click', () => {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      body.hidden = expanded;
    });

    // Browse all

    document.getElementById('browse-all-btn').addEventListener('click', () => {
      const url = document.getElementById('browse-all-btn').dataset.url;
      if (url) window.openai?.setOpenInAppUrl?.(url);
    });

    // Scroll arrows

    const track   = document.getElementById('carousel-track');
    const btnPrev = document.getElementById('scroll-prev');
    const btnNext = document.getElementById('scroll-next');

    btnPrev.addEventListener('click', () => track.scrollBy({ left: -256, behavior: 'smooth' }));
    btnNext.addEventListener('click', () => track.scrollBy({ left:  256, behavior: 'smooth' }));

    function updateArrows() {
      const canScroll = track.scrollWidth > track.clientWidth + 4;
      const atStart   = track.scrollLeft <= 20;
      const atEnd     = track.scrollLeft + track.clientWidth >= track.scrollWidth - 8;
      btnPrev.classList.toggle('visible', canScroll && !atStart);
      btnNext.classList.toggle('visible', canScroll && !atEnd);
    }

    track.addEventListener('scroll', updateArrows, { passive: true });
    window.addEventListener('resize', updateArrows);

    // Sanitise

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function escAttr(s) {
      return String(s ?? '').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    if (window.openai) applyGlobals(window.openai);
  </script>
</body>
</html>
